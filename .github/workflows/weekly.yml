name: Weekly Digest

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-main-writer
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install
      - name: Generate weekly digest
        run: npm run weekly
      - name: Consistency check
        run: npm run check
      - name: Commit and push changes
        run: |
          git config user.name "dsh-hub[bot]"
          git config user.email "dsh-hub[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly digest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
